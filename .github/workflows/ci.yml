name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.3", "3.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run bundle-audit
        run: bundle exec bundle-audit check --update

      - name: Run rubocop
        run: bundle exec rubocop

      - name: Run reek
        run: bundle exec reek

      - name: Run YARD doc coverage
        run: bundle exec rake yard:coverage

      - name: Run minitest
        run: bundle exec rake test

  container-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build evaluator-sandbox image
        run: bundle exec rake docker:build

      - name: Run live Docker integration tests
        env:
          SKILL_BENCH_DOCKER_TESTS: "1"
        run: bundle exec ruby -Itest test/evaluator/sandbox_docker_live_test.rb
