# .reek.yml — code-smell gate for CI (`bundle exec reek` / `rake reek`)
#
# Policy (triage, not zero-noise):
#   HIGH-SIGNAL — stay ENABLED for lib/. Exclude only intentional / deferred debt
#     with a short reason comment:
#       TooManyMethods, LongParameterList, DataClump, ControlParameter,
#       InstanceVariableAssumption, RepeatedConditional, TooManyStatements,
#       TooManyInstanceVariables, BooleanParameter, UnusedParameters
#
#   LOW-SIGNAL / CHRONIC FALSE POSITIVES — disabled globally under detectors:
#       FeatureEnvy, NilCheck, NestedIterators, ManualDispatch,
#       UtilityFunction, MissingSafeMethod
#
#   TUNED (enabled, less twitchy):
#       DuplicateMethodCall max_calls: 3
#       UncommunicativeVariableName accept: _, c, m, and common short names
#
#   TEST TREE ONLY — the directories."test" block disables detectors for files
#     under test/. It does NOT disable those detectors for lib/. High-signal
#     rules (DataClump, LongParameterList, …) remain enabled on production code.
#
# When adding an exclude: name the smell, the context, and why it is intentional.
# Prefer fixing structure over growing this file for high-signal detectors.

exclude_paths:
  - "examples/evals/**/source"

# Scope: path prefix "test" only. Detectors listed here are off for specs;
# they stay on for lib/ unless disabled under the top-level detectors: key.
directories:
  "test":
    IrresponsibleModule:
      enabled: false
    DuplicateMethodCall:
      enabled: false
    TooManyStatements:
      enabled: false
    FeatureEnvy:
      enabled: false
    InstanceVariableAssumption:
      enabled: false
    UtilityFunction:
      enabled: false
    NestedIterators:
      enabled: false
    UncommunicativeVariableName:
      enabled: false
    ControlParameter:
      enabled: false
    TooManyMethods:
      enabled: false
    UnusedParameters:
      enabled: false
    UncommunicativeMethodName:
      enabled: false
    NilCheck:
      enabled: false
    ManualDispatch:
      enabled: false
    DataClump:
      enabled: false
    LongParameterList:
      enabled: false

detectors:
  # --- disabled globally (low signal for this project) ---
  FeatureEnvy:
    enabled: false
  NilCheck:
    enabled: false
  NestedIterators:
    enabled: false
  ManualDispatch:
    enabled: false
  UtilityFunction:
    enabled: false
  MissingSafeMethod:
    enabled: false

  # --- tuned ---
  DuplicateMethodCall:
    enabled: true
    max_calls: 3
    # Exclude only methods that intentionally call the same expression 3+ times
    # for distinct semantic reasons (rescue pairs, multi-branch formatting, etc.).
    exclude:
      - "SkillBench::TrendTracker#record"                        # Two rescue blocks each use e.message
      - "SkillBench::Services::RunnerService#record_and_compute_trend"
      - "SkillBench::TrendTracker::Persistence#write"            # Two rescue blocks each use e.message
      - "SkillBench::Models::CriteriaValidator#validate_dimensions" # dim[:max_score] in all? and sum
      - "SkillBench::Cli::CompareCommand#call"                   # options[:variant_*] across validation + dispatch
      - "SkillBench::Services::RunnerService#evaluate_and_record_trend" # context.baseline/context_output across judge + tokens
      - "SkillBench::Services::AgentSpawnerService#run_agent"    # provider/sandbox fields used in success and error paths
      - "SkillBench::Clients::ResponseParser#self.parse_body"   # response.body branches (empty/string/JSON) — intentional

  UncommunicativeVariableName:
    enabled: true
    accept:
      - "_"
      - "c"
      - "d"
      - "e"
      - "f"
      - "id"
      - "m"
      - "t"
      - "v"

  # --- high-signal: size / structure (explicitly enabled for lib/) ---
  TooManyMethods:
    enabled: true
    max_methods: 15
    exclude:
      - "SkillBench::Clients::BaseClient"
      - "SkillBench::Clients::Providers::Anthropic"
      - "SkillBench::Config::Store"
      - "SkillBench::Config"
      - "SkillBench::Services::RunnerService"              # orchestration class — refactor deferred
      - "SkillBench::Cli::ValidateCommand"                 # multi-check CLI; split deferred

  # High-signal: ENABLED. The exclude list is debt, not a global off-switch.
  LongParameterList:
    enabled: true
    max_params: 6
    exclude:
      - "SkillBench::Evaluation::Runner#initialize"
      - "SkillBench::Models::Eval#initialize"
      - "SkillBench::Services::ResponseCache#key"           # cache key parts are the domain; group object deferred

  TooManyStatements:
    enabled: true
    max_statements: 25
    exclude:
      - "SkillBench::Commands::Run"

  TooManyInstanceVariables:
    enabled: true
    max_instance_variables: 6
    exclude:
      - "SkillBench::Clients::BaseClient"
      - "SkillBench::DeltaReport"

  TooManyConstants:
    enabled: true
    exclude:
      - "SkillBench::Services::TemplateRegistry"            # lookup tables are the domain

  # High-signal: ENABLED. The exclude list is debt, not a global off-switch.
  DataClump:
    enabled: true
    exclude:
      - "SkillBench::Tools"
      - "SkillBench::Services::RunnerService"
      - "SkillBench::Judge::Response"                       # dimension name+hash travel together
      - "SkillBench::Cli::ValidateCommand"                 # check result (name, message) pairs
      - "SkillBench::Registry::PackResolver"               # skill_name + visited cycle-guard pair
      - "SkillBench::Services::ComparisonReporter"         # report_a/report_b comparison pair

  ControlParameter:
    enabled: true
    exclude:
      - "SkillBench::Cli::BatchResultPrinter#self.batch_output"
      - "SkillBench::Commands::Run#validate_api_key"
      - "SkillBench::Execution::ContextHydrator#initialize"
      - "SkillBench::EvaluateCommand#print_parse_error"
      - "SkillBench::OutputFormatter#self.format"
      - "SkillBench::Tools::Base"
      - "SkillBench::Client#self.call"
      - "SkillBench::Services::CostCalculator#initialize"  # usage hash gates free-tier vs priced path

  RepeatedConditional:
    enabled: true
    exclude:
      - "SkillBench::OutputFormatter"
      - "SkillBench::Commands::Run"
      - "SkillBench::Config"
      - "SkillBench::Registry::PackResolver"               # resolved-nil cycle / miss branches

  # --- high-signal: inheritance / state ---
  InstanceVariableAssumption:
    enabled: true
    exclude:
      # Provider subclasses read BaseClient-initialized config ivars by design
      - "SkillBench::Clients::Providers::Anthropic"
      - "SkillBench::Clients::Providers::AzureOpenAI"
      - "SkillBench::Clients::Providers::DeepSeek"
      - "SkillBench::Clients::Providers::Gemini"
      - "SkillBench::Clients::Providers::Groq"
      - "SkillBench::Clients::Providers::Mistral"
      - "SkillBench::Clients::Providers::Ollama"
      - "SkillBench::Clients::Providers::OpenAI"
      - "SkillBench::Clients::Providers::OpenCode"
      - "SkillBench::Clients::Providers::OpenRouter"
      - "SkillBench::Config::Store"
      - "SkillBench::Cli::Eval::NewEvalOptions"            # @options from BaseEvalOptions#initialize
      - "SkillBench::Cli::Eval::GenerateEvalOptions"       # @options from BaseEvalOptions#initialize
      - "SkillBench::Services::SkillResolverService"       # thin facade; @call is module-level alias pattern

  Attribute:
    enabled: true
    exclude:
      - "SkillBench::Config"
      - "SkillBench::Config::Store"

  BooleanParameter:
    enabled: true
    exclude:
      - "SkillBench::Cli::BatchResultPrinter#self.call"    # summary: documented CI signature gate
      - "SkillBench::Commands::Init#self.run"
      - "SkillBench::Clients::BaseUrlValidator#self.call"  # has_credential/allow_insecure security inputs

  UnusedParameters:
    enabled: true
    exclude:
      - "SkillBench::Skills::New#initialize"
      - "SkillBench::Skills::TestService#initialize"
      - "SkillBench::Cli::Eval::BaseEvalCommand#call"      # abstract base — argv is subclass contract
